botToken: 'YOUR_BOT_TOKEN'
guildId: 123456789012345678

channels:
  ticketChannelId: 123456789012345678
  faqChannelId: 123456789012345678
  memberLogChannelId: 123456789012345678   # Join, Leave, Ban, Unban, Nickname, Username
  roleLogChannelId: 123456789012345678     # Rollen hinzugefügt / entfernt
  messageLogChannelId: 123456789012345678
  voiceLogChannelId: 123456789012345678
  countingChannelId: 123456789012345678
  automodLogChannelId: 123456789012345678

database:
  host: localhost
  port: 3306
  database: yourdatabase
  username: root
  password: yourpassword

automod:
  linkFilter:
    enabled: false
    allowedDomains:
      - youtube.com              # gesamte Domain erlaubt
      - discord.com              # gesamte Domain erlaubt
      - twitch.tv/pumpeklein     # nur dieser Kanal erlaubt
    ignoredChannels:
      - 123456789012345678

  chatSpam:
    enabled: false
    maxMessages: 5          # Maximale Nachrichten im Zeitfenster
    timeWindowSeconds: 5    # Zeitfenster in Sekunden
    timeoutSeconds: 60      # Timeout-Dauer (0 = kein Timeout)
    ignoredChannels:
      - 123456789012345678

  voiceSpam:
    enabled: false
    maxEvents: 5            # Maximale Join/Leave-Aktionen im Zeitfenster
    timeWindowSeconds: 5    # Zeitfenster in Sekunden

autoRoles:
  - 123456789012345678   # Rolle, die beim Betreten automatisch vergeben wird
  - 123456789012345679   # weitere Auto-Rolle (beliebig viele möglich)

